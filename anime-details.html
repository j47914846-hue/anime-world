<style>
  :root{
    --bg-base:#0a0713;
    --bg-panel:#140f22;
    --bg-panel-light:#1c1530;
    --neon-pink:#ff2ec4;
    --neon-purple:#8b2fff;
    --neon-blue:#2fd8ff;
    --text-main:#f1eefc;
    --text-dim:#a79cc7;
    --border-soft:rgba(255,255,255,0.08);
    --shadow-glow: 0 0 20px rgba(255,46,196,0.35), 0 0 40px rgba(139,47,255,0.2);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--bg-base);
    color:var(--text-main);
    font-family:'Poppins', sans-serif;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(139,47,255,0.12), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(255,46,196,0.10), transparent 40%);
  }

  html[dir="rtl"] body{ font-family:'Vazirmatn', sans-serif; }
  html[dir="rtl"] .logo{ font-family:'Vazirmatn', sans-serif; }

  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;border:none;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-base);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-pink), var(--neon-purple));border-radius:10px;}

  .container{width:100%;max-width:1000px;margin:0 auto;padding:0 24px;}

  /* Header */
  header{
    position:sticky; top:0; z-index:1000;
    background:rgba(10,7,19,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .logo{
    font-family:'Bangers', cursive; letter-spacing:2px; font-size:1.6rem;
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    flex-shrink:0;
  }
  .back-link{
    display:flex; align-items:center; gap:8px;
    font-size:0.9rem; font-weight:500; color:var(--text-dim);
    transition:color 0.25s;
  }
  .back-link:hover{color:var(--neon-pink);}

  .lang-switch{
    display:flex; background:var(--bg-panel-light); border:1px solid var(--border-soft);
    border-radius:999px; padding:4px; gap:2px; flex-shrink:0;
  }
  .lang-btn{
    padding:6px 14px; border-radius:999px; background:transparent;
    color:var(--text-dim); font-size:0.8rem; font-weight:600; transition:all 0.25s ease;
  }
  .lang-btn.active{
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    color:#fff; box-shadow:0 0 10px rgba(255,46,196,0.4);
  }

  /* Hero banner for the anime */
  .detail-hero{
    position:relative;
    min-height:46vh;
    display:flex; align-items:flex-end;
    padding:50px 24px 40px;
    background-size:cover; background-position:center;
  }
  .detail-hero::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,7,19,0.2) 0%, rgba(10,7,19,0.97) 100%);
  }
  .detail-hero-inner{
    position:relative; z-index:2; max-width:1000px; margin:0 auto; width:100%;
  }
  .detail-hero h1{
    font-size:clamp(1.6rem, 4.5vw, 2.6rem);
    font-weight:800; margin-bottom:10px; line-height:1.3;
  }
  .detail-meta{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px;
  }
  .detail-rating{
    background:rgba(10,7,19,0.7); color:#ffd76a; font-weight:600;
    padding:5px 14px; border-radius:999px; border:1px solid rgba(255,215,106,0.4);
    font-size:0.9rem;
  }
  .detail-genre-tag{
    font-size:0.75rem; padding:4px 12px; border-radius:999px;
    background:rgba(47,216,255,0.12); color:var(--neon-blue);
    border:1px solid rgba(47,216,255,0.3);
  }

  /* Body content */
  .detail-body{ padding:50px 0 90px; }

  .detail-card{
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:20px;
    padding:32px;
    margin-bottom:28px;
  }

  .detail-card h2{
    font-size:1.3rem; margin-bottom:16px;
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:inline-block;
  }

  .detail-card p{
    color:var(--text-dim); line-height:1.9; font-size:1rem;
  }

  /* Download list */
  .download-list{ display:flex; flex-direction:column; gap:14px; }

  .download-item{
    background:var(--bg-panel-light);
    border:1px solid var(--border-soft);
    border-radius:14px;
    overflow:hidden;
    transition:border-color 0.25s ease;
  }
  .download-item:hover{ border-color:var(--neon-purple); }

  .dl-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:16px 20px;
    cursor:pointer;
    user-select:none;
  }
  .dl-quality{ font-weight:700; font-size:1rem; }

  .dl-chevron{
    width:18px; height:18px;
    transition:transform 0.3s ease;
    stroke:var(--text-dim);
    flex-shrink:0;
  }
  .download-item.open .dl-chevron{ transform:rotate(180deg); }

  .dl-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.4s ease, padding 0.4s ease;
    padding:0 20px;
  }
  .download-item.open .dl-panel{
    max-height:400px;
    padding:0 20px 18px;
  }

  .ep-list{ display:flex; flex-direction:column; gap:10px; }
  .coming-soon{
    padding:16px 10px; text-align:center; color:var(--text-dim); font-size:0.85rem;
    background:rgba(255,255,255,0.03); border-radius:10px; border:1px dashed var(--border-soft);
  }
  .ep-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; padding:10px 14px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border-soft);
    border-radius:10px;
  }
  .ep-label{ font-size:0.9rem; color:var(--text-main); font-weight:500; }

  .dl-btn{
    display:inline-block;
    padding:8px 22px; border-radius:999px;
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    color:#fff; font-weight:600; font-size:0.8rem;
    box-shadow:0 0 12px rgba(255,46,196,0.3);
    transition:all 0.25s ease;
  }
  .dl-btn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 0 20px rgba(255,46,196,0.5); }

  .dl-note{
    margin-top:16px; font-size:0.8rem; color:var(--text-dim);
    padding:12px 16px; border-radius:10px;
    background:rgba(47,216,255,0.06); border:1px dashed rgba(47,216,255,0.25);
  }

  /* Not found state */
  .not-found{
    text-align:center; padding:100px 24px;
  }
  .not-found h1{ font-size:2rem; margin-bottom:16px; }
  .not-found p{ color:var(--text-dim); margin-bottom:24px; }
  .btn-primary{
    display:inline-block; padding:14px 34px; border-radius:999px;
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    color:#fff; font-weight:600; box-shadow:var(--shadow-glow);
    transition:transform 0.25s ease;
  }
  .btn-primary:hover{ transform:translateY(-3px); }

  /* Ad banner */
  .ad-banner{ margin:0 0 24px; }
  .ad-banner-label{
    font-size:0.68rem; color:var(--text-dim); text-align:center;
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; opacity:0.6;
  }
  .ad-banner a{
    display:block; border-radius:16px; overflow:hidden;
    border:1px solid var(--border-soft); transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .ad-banner a:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(139,47,255,0.25); }
  .ad-banner img{ width:100%; display:block; object-fit:cover; max-height:220px; }
  .ad-embed-wrap{ width:100%; overflow:hidden; }

  @media (max-width:600px){
    html, body{ overflow-x:hidden; max-width:100%; }
    .navbar{ padding:12px 16px; gap:10px; }
    .logo{ font-size:1.25rem; }
    .back-link{ font-size:0.8rem; flex-basis:100%; order:3; justify-content:center; }

    .detail-hero{ min-height:36vh; padding:36px 16px 28px; }
    .detail-hero h1{ font-size:1.4rem; }
    .detail-rating{ font-size:0.8rem; padding:4px 12px; }
    .detail-genre-tag{ font-size:0.7rem; }

    .detail-card{ padding:20px 16px; }
    .dl-header{ padding:14px 16px; }
    .dl-quality{ font-size:0.92rem; }

    .ep-item{ flex-wrap:wrap; gap:8px; }
    .ep-label{ flex:1 1 auto; }
    .dl-btn{ flex-shrink:0; }

    .not-found{ padding:70px 18px; }
    .not-found h1{ font-size:1.5rem; }
  }
</style>

const adsData = {
  detailBanner: { type:"image", img:"", link:"", code:`` }
};
function injectEmbedCode(container, codeHtml){
  container.innerHTML = codeHtml;
  const scripts = container.querySelectorAll('script');
  scripts.forEach(oldScript => {
    const newScript = document.createElement('script');
    for(const attr of oldScript.attributes) newScript.setAttribute(attr.name, attr.value);
    newScript.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
}
function renderAdSlot(elId, ad, label){
  const el = document.getElementById(elId);
  if(!el) return;
  if(!ad){ el.innerHTML = ''; return; }

  if(ad.type === 'code'){
    if(!ad.code || !ad.code.trim()){ el.innerHTML = ''; return; }
    el.innerHTML = `<div class="ad-banner"><div class="ad-banner-label">${label}</div><div class="ad-embed-wrap"></div></div>`;
    injectEmbedCode(el.querySelector('.ad-embed-wrap'), ad.code);
    return;
  }

  if(!ad.img || !ad.link){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="ad-banner">
      <div class="ad-banner-label">${label}</div>
      <a href="${ad.link}" target="_blank" rel="noopener sponsored">
        <img src="${ad.img}" alt="Advertisement" loading="lazy">
      </a>
    </div>
  `;
}

/* =========================================================
   STATE + HELPERS
========================================================= */
let currentLang = "en";

function getQueryParam(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

const pageContent = document.getElementById('pageContent');
const animeId = getQueryParam('id');
const anime = animeId ? animeDetails[animeId] : null;

function renderPage(){
  if(!anime){
    pageContent.innerHTML = `
      <div class="not-found">
        <h1>${uiText[currentLang].notFoundTitle}</h1>
        <p>${uiText[currentLang].notFoundText}</p>
        <a href="index.html" class="btn-primary">${uiText[currentLang].notFoundBtn}</a>
      </div>
    `;
    return;
  }

  const ratingDisplay = anime.rating !== null ? `★ ${anime.rating}` : uiText[currentLang].notRated;

  pageContent.innerHTML = `
    <section class="detail-hero" style="background-image:url('${anime.img}')">
      <div class="detail-hero-inner">
        <h1>${anime.title[currentLang]}</h1>
        <div class="detail-meta">
          <span class="detail-rating">${ratingDisplay}</span>
          ${anime.genres.map(g => `<span class="detail-genre-tag">${genreLabels[g] ? genreLabels[g][currentLang] : g}</span>`).join('')}
        </div>
      </div>
    </section>

    <div class="detail-body">
      <div class="container">
        <div id="adDetailSlot"></div>

        <div class="detail-card">
          <h2>${uiText[currentLang].synopsisTitle}</h2>
          <p>${anime.synopsis[currentLang]}</p>
        </div>

        <div class="detail-card">
          <h2>${uiText[currentLang].downloadsTitle}</h2>
          <div class="download-list">
            ${anime.downloads.map(d => {
              const visibleEpisodes = (d.episodes || []).filter(e => !e.hidden);
              const panelBody = visibleEpisodes.length > 0
                ? `<div class="ep-list">
                    ${visibleEpisodes.map(e => `
                      <div class="ep-item">
                        <span class="ep-label">${currentLang === 'fa' ? 'قسمت ' + e.ep : 'Episode ' + e.ep}</span>
                        <a href="${e.url}" class="dl-btn" onclick="event.stopPropagation(); return false;">${currentLang === 'fa' ? 'دانلود' : 'Download'}</a>
                      </div>
                    `).join('')}
                  </div>`
                : `<div class="coming-soon">${uiText[currentLang].comingSoon}</div>`;
              return `
                <div class="download-item">
                  <div class="dl-header" onclick="this.parentElement.classList.toggle('open')">
                    <span class="dl-quality">${d.quality}</span>
                    <svg class="dl-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </div>
                  <div class="dl-panel">${panelBody}</div>
                </div>
              `;
            }).join('')}
          </div>
          <p class="dl-note">${uiText[currentLang].downloadNote}</p>
        </div>
      </div>
    </div>
  `;

  renderAdSlot('adDetailSlot', adsData.detailBanner, currentLang === 'fa' ? 'تبلیغات' : 'Advertisement');
}

/* =========================================================
   LANGUAGE SWITCHING
========================================================= */
function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(uiText[lang][key] !== undefined) el.textContent = uiText[lang][key];
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  renderPage();
}

document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});

/* Initial render */
applyLanguage('en');
</script>
